<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E83A13">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Mi Semana</title>
<style>
:root{--cream:#F7E9B9;--orange:#E83A13;--line:#D98562;--ink:#8E2B13}
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--orange)}
button,input,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:12px}
.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.nav{display:flex;gap:6px;align-items:center}.btn{border:1px solid var(--orange);background:var(--cream);color:var(--orange);padding:8px 12px;font-weight:800;cursor:pointer;border-radius:0}
.weeklabel{font-weight:900;min-width:155px;text-align:center}.paper{background:var(--cream);border:1px solid var(--line);padding:22px}
h1{font-size:clamp(3rem,8vw,6rem);line-height:.8;margin:0 0 12px;font-weight:900;letter-spacing:-.07em}
.days{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line)}
.day{border-right:1px solid var(--line)}.day:last-child{border:0}.dayname{text-align:center;font-size:12px;font-weight:900;padding:7px 2px}
.day textarea{display:block;width:100%;height:145px;border:0;border-top:1px solid var(--line);background:transparent;resize:none;padding:8px;color:var(--ink);outline:none;font-size:13px}
.lower{display:grid;grid-template-columns:1.05fr 1.35fr 1.05fr .9fr;gap:18px;margin-top:18px}.section h2{font-size:17px;margin:0 0 8px;font-weight:900}.checks{display:grid;gap:5px}.checkrow{display:flex;align-items:center;gap:6px;min-height:27px}.checkrow input[type=text]{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);outline:none;padding:3px}
input[type=checkbox]{appearance:none;width:17px;height:17px;border:1px solid var(--orange);background:transparent;cursor:pointer;flex:none;position:relative}
input[type=checkbox]:checked{background:var(--orange)}input[type=checkbox]:checked:after{content:"✓";position:absolute;color:#fff;font-weight:900;left:3px;top:-1px}
.prompt{font-size:10px;font-weight:900;margin:0 0 4px}.promptbox{display:block;width:100%;height:45px;border:1px solid var(--line);background:transparent;color:var(--ink);resize:none;padding:6px;margin-bottom:8px;outline:none}
.habit{display:grid;grid-template-columns:minmax(70px,1fr) repeat(7,18px);gap:4px;align-items:center;margin:5px 0}.habit input[type=text]{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);width:100%;padding:2px;outline:none;font-size:11px}.habithead{font-size:9px;font-weight:900;text-align:center}
.menu{border:1px solid var(--line)}.menuhead{background:var(--orange);color:#fff;text-align:center;font-size:18px;font-weight:900;padding:9px}.menurow{display:grid;grid-template-columns:25px 1fr;border-top:1px solid var(--line);min-height:39px}.menurow b{padding:9px 4px}.menurow input{width:100%;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);padding:5px;outline:none;font-size:11px}
@media(max-width:850px){.lower{grid-template-columns:1fr 1fr}.days{overflow-x:auto;grid-template-columns:repeat(7,125px)}}
@media(max-width:560px){.app{padding:6px}.paper{padding:12px}.lower{grid-template-columns:1fr}.toolbar{align-items:stretch}.nav{width:100%;justify-content:space-between}.weeklabel{min-width:0;flex:1}.days{grid-template-columns:repeat(7,118px)}}
@media print{body{background:#fff}.toolbar{display:none}.app{max-width:none;padding:0}.paper{border:0}.days{grid-template-columns:repeat(7,1fr)}.day textarea{height:125px}.lower{grid-template-columns:1.05fr 1.35fr 1.05fr .9fr;gap:10px}}
</style>
</head>
<body>
<div class="app">
<div class="toolbar">
<div class="nav"><button class="btn" id="prev">← Anterior</button><span class="weeklabel" id="weekLabel"></span><button class="btn" id="next">Siguiente →</button></div>
<div><button class="btn" id="today">Esta semana</button><button class="btn" id="print">Imprimir</button></div>
</div>
<div class="paper">
<h1>SEMANA</h1>
<div class="days" id="days"></div>
<div class="lower">
<section class="section"><h2>TAREAS Y PENDIENTES</h2><div class="checks" id="tasks"></div></section>
<section class="section">
<div class="prompt">• FRASE DE LA SEMANA</div><textarea class="promptbox" data-key="phrase"></textarea>
<div class="prompt">• AGRADECIDO POR</div><textarea class="promptbox" data-key="grateful"></textarea>
<div class="prompt">• PLANES / SALIDA</div><textarea class="promptbox" data-key="plans"></textarea>
<div class="prompt">• PAGOS</div><textarea class="promptbox" data-key="payments"></textarea>
<div class="prompt">• NOTAS</div><textarea class="promptbox" data-key="notes"></textarea>
</section>
<section class="section"><h2>COMPRAS</h2><div class="checks" id="groceries"></div><h2 style="margin-top:15px">SEGUIMIENTO DE HÁBITOS</h2><div class="habit"><span></span><span class="habithead">L</span><span class="habithead">M</span><span class="habithead">X</span><span class="habithead">J</span><span class="habithead">V</span><span class="habithead">S</span><span class="habithead">D</span></div><div id="habits"></div></section>
<section class="section"><div class="menu"><div class="menuhead">MENÚ</div><div id="menu"></div></div></section>
</div></div></div>
<script>
const KEY="mi-semana-v1";let weekOffset=0;
const dayNames=["LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO","DOMINGO"];
const menuDays=["L","M","X","J","V","S","D"];
function monday(d){d=new Date(d);let n=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d}
function key(){let d=monday(new Date());d.setDate(d.getDate()+weekOffset*7);return d.toISOString().slice(0,10)}
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(all))}
let all=loadAll();
function blank(){return {days:Array(7).fill(""),tasks:Array.from({length:10},()=>({t:"",c:false})),groceries:Array.from({length:10},()=>({t:"",c:false})),habits:Array.from({length:5},()=>({t:"",c:Array(7).fill(false)})),menu:Array(7).fill(""),phrase:"",grateful:"",plans:"",payments:"",notes:""}}
function data(){let k=key();if(!all[k])all[k]=blank();return all[k]}
function render(){let d=data();let mondayDate=monday(new Date(key()+"T00:00:00"));document.getElementById("weekLabel").textContent=mondayDate.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+" – "+new Date(mondayDate.getTime()+6*86400000).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
document.getElementById("days").innerHTML=dayNames.map((n,i)=>`<div class="day"><div class="dayname">${n}</div><textarea data-day="${i}" aria-label="${n}">${esc(d.days[i])}</textarea></div>`).join("");
renderChecks("tasks",d.tasks);renderChecks("groceries",d.groceries);
document.querySelectorAll("[data-key]").forEach(x=>x.value=d[x.dataset.key]);
document.getElementById("habits").innerHTML=d.habits.map((h,r)=>`<div class="habit"><input type="text" data-habit="${r}" value="${esc(h.t)}" placeholder="Hábito">${h.c.map((v,i)=>`<input type="checkbox" data-habit-c="${r}-${i}" ${v?"checked":""}>`).join("")}</div>`).join("");
document.getElementById("menu").innerHTML=d.menu.map((v,i)=>`<div class="menurow"><b>${menuDays[i]}</b><input type="text" data-menu="${i}" value="${esc(v)}" placeholder="Escribe aquí..."></div>`).join("");
wire()}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function renderChecks(id,arr){document.getElementById(id).innerHTML=arr.map((x,i)=>`<label class="checkrow"><input type="checkbox" data-${id}-c="${i}" ${x.c?"checked":""}><input type="text" data-${id}-t="${i}" value="${esc(x.t)}" placeholder="${id==="tasks"?"Pendiente":"Producto"}"></label>`).join("")}
function wire(){document.querySelectorAll("[data-day]").forEach(x=>x.oninput=()=>{data().days[x.dataset.day]=x.value;save()});
document.querySelectorAll("[data-key]").forEach(x=>x.oninput=()=>{data()[x.dataset.key]=x.value;save()});
["tasks","groceries"].forEach(id=>{document.querySelectorAll(`[data-${id}-t]`).forEach(x=>x.oninput=()=>{data()[id][x.dataset[id+"T"]].t=x.value;save()});document.querySelectorAll(`[data-${id}-c]`).forEach(x=>x.onchange=()=>{data()[id][x.dataset[id+"C"]].c=x.checked;save()})});
document.querySelectorAll("[data-habit]").forEach(x=>x.oninput=()=>{data().habits[x.dataset.habit].t=x.value;save()});document.querySelectorAll("[data-habit-c]").forEach(x=>x.onchange=()=>{let[a,b]=x.dataset.habitC.split("-").map(Number);data().habits[a].c[b]=x.checked;save()});
document.querySelectorAll("[data-menu]").forEach(x=>x.oninput=()=>{data().menu[x.dataset.menu]=x.value;save()})}
document.getElementById("prev").onclick=()=>{weekOffset--;render()};document.getElementById("next").onclick=()=>{weekOffset++;render()};document.getElementById("today").onclick=()=>{weekOffset=0;render()};document.getElementById("print").onclick=()=>window.print();render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script></body></html>
