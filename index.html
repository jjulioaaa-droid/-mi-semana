<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E84A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Journal</title>
<style>:root{
  --cream:#F8E9B7;
  --cream-deep:#F3DFA0;
  --paper:#FAEDC4;
  --orange:#E84A24;
  --orange-dark:#B9361A;
  --ink:#71311F;
  --line:#D99572;
  --line-soft:rgba(217,149,114,.62);
  --muted:#9E7A6C;
  --white:#FFF9E9;
  --radius:2px;
  --font-display:"Avenir Next Condensed","Arial Narrow","Trebuchet MS",sans-serif;
  --font-body:"Avenir Next","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:#ece7df}
body{margin:0;background:#ece7df;color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
.app{max-width:1260px;margin:auto;padding:14px 14px 30px}

/* SISTEMA VISUAL: misma línea, mismo borde, misma geometría */
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.nav,.actions{display:flex;gap:8px;align-items:center}
.btn{appearance:none;border:1.5px solid var(--orange);background:var(--cream);color:var(--orange-dark);padding:9px 14px;font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:.045em;text-transform:uppercase;cursor:pointer;border-radius:var(--radius);min-height:42px;transition:background .15s,color .15s,transform .08s}
.btn:hover{background:var(--cream-deep)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--orange-dark);outline-offset:2px}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.primary:hover{background:var(--orange-dark)}
.btn.small{min-height:38px;padding:7px 10px;font-size:11px}
.weeklabel{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:.065em;min-width:175px;text-align:center;text-transform:uppercase;color:var(--orange-dark)}

.paper{background:var(--cream);border:1px solid var(--line);padding:26px 28px 30px}
h1{font-family:var(--font-display);font-size:clamp(4rem,9vw,7.3rem);line-height:.78;margin:0 0 20px;color:var(--orange);font-weight:900;letter-spacing:-.055em}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);background:rgba(255,249,233,.08)}
.day{min-width:0;border-right:1px solid var(--line)}
.day:last-child{border-right:0}
.dayname{text-align:center;font-family:var(--font-display);font-size:14px;letter-spacing:.075em;font-weight:800;padding:8px 3px;color:var(--orange);text-transform:uppercase}
.day textarea{display:block;width:100%;height:142px;border:0;border-top:1px solid var(--line);background:transparent;resize:none;padding:10px;color:var(--ink);outline:none;font-size:13px;line-height:1.45}

/* HORARIO FIJO: pertenece al usuario, no a una semana */
.schedule-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px;padding:0 2px}
.schedule-title{font-family:var(--font-display);font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-dark)}
.schedule-actions{display:flex;gap:7px}
.schedule-btn{min-height:34px;padding:6px 10px;font-size:11px}
.day textarea.schedule{height:142px}
.day textarea.schedule:disabled{opacity:1;color:var(--ink);cursor:default}
.day textarea.schedule.editing{background:rgba(255,249,233,.22);box-shadow:inset 0 0 0 1px var(--orange)}
@media(max-width:720px){
  .schedule-head{margin-bottom:7px}
  .schedule-btn{min-height:36px;padding:7px 10px}
  .day textarea.schedule{height:125px}
}
.progress-wrap{display:flex;align-items:center;gap:12px;margin:17px 0 0}
.progress-label,.section h2,.prompt,.habithead,.menuhead,.menu-grid .mh,.menu-day{font-family:var(--font-display)}
.progress-label{font-size:15px;font-weight:800;white-space:nowrap;text-transform:uppercase;letter-spacing:.055em;color:var(--ink)}
.progress{height:9px;border:1px solid var(--line);flex:1;background:transparent;overflow:hidden}
.progress>span{display:block;height:100%;width:0;background:var(--orange);transition:width .2s}
.progress-count{font-size:11px;font-weight:700;min-width:82px;text-align:right;color:var(--orange-dark)}

.lower{display:grid;grid-template-columns:1.1fr 1.15fr 1fr 1.15fr;gap:22px;margin-top:20px}
.section{min-width:0}
.section h2{font-size:20px;letter-spacing:.045em;color:var(--orange);margin:0 0 10px;font-weight:900;text-transform:uppercase}
.checks{display:grid;gap:5px}
.checkrow{display:grid;grid-template-columns:20px minmax(0,1fr) 82px;gap:8px;align-items:center;min-height:34px}
.checkrow.grocery{grid-template-columns:20px minmax(0,1fr) 88px}

/* Todos los campos comparten el mismo lenguaje: fondo transparente + línea inferior */
.checkrow input[type=text],.habit input[type=text],.payrow input,.menu-cell input{min-width:0;width:100%;border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--ink);outline:none}
.checkrow input[type=text]{padding:6px 2px;font-size:13px}
.checkrow input[type=text]::placeholder,.habit input[type=text]::placeholder,.payrow input::placeholder,.menu-cell input::placeholder,.promptbox::placeholder{color:var(--muted);opacity:.72}
.checkrow input[type=text]:focus,.habit input[type=text]:focus,.payrow input:focus,.menu-cell input:focus{border-bottom-color:var(--orange);background:rgba(255,249,233,.28)}

input[type=checkbox]{appearance:none;width:20px;height:20px;border:1.5px solid var(--orange);background:transparent;cursor:pointer;flex:none;position:relative;border-radius:var(--radius);margin:0}
input[type=checkbox]:checked{background:var(--orange)}
input[type=checkbox]:checked:after{content:"✓";position:absolute;color:#fff;font-size:14px;font-weight:900;left:3px;top:-1px}
input[type=checkbox]:focus-visible{outline:2px solid var(--orange-dark);outline-offset:2px}

/* Selectores integrados al sistema de formularios */
.mini-select{appearance:none;border:1px solid var(--line-soft);border-radius:var(--radius);background:rgba(255,249,233,.18);color:var(--orange-dark);font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.025em;padding:6px 18px 6px 7px;outline:none;width:100%;min-height:30px;background-image:linear-gradient(45deg,transparent 50%,var(--orange-dark) 50%),linear-gradient(135deg,var(--orange-dark) 50%,transparent 50%);background-position:calc(100% - 8px) 12px,calc(100% - 5px) 12px;background-size:3px 3px,3px 3px;background-repeat:no-repeat}
.mini-select:hover{background-color:rgba(255,249,233,.38)}
.mini-select:focus-visible{outline:2px solid var(--orange-dark);outline-offset:1px}
.priority-alta{color:var(--orange-dark)!important;border-color:var(--orange)!important}
.priority-media{color:#8E5C49!important}
.priority-baja{color:var(--muted)!important}

/* AGRUPACIÓN AUTOMÁTICA */
.group-block{margin:0 0 11px}
.group-block:last-child{margin-bottom:0}
.group-title{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:10px;font-weight:900;letter-spacing:.055em;text-transform:uppercase;color:var(--orange-dark);padding:2px 0 4px;border-bottom:1px solid var(--line-soft);margin-bottom:2px}
.group-title .group-count{font-family:var(--font-body);font-size:9px;font-weight:700;color:var(--muted);letter-spacing:0}
.group-title.priority-alta{color:var(--orange-dark)!important}
.group-title.priority-media{color:#8E5C49!important}
.group-title.priority-baja{color:var(--muted)!important}
.checkrow.grouped-row{grid-template-columns:20px minmax(0,1fr) 82px}
.checkrow.grocery.grouped-row{grid-template-columns:20px minmax(0,1fr) 88px}
@media(max-width:700px){.group-title{font-size:11px;padding-top:4px}.group-block{margin-bottom:13px}}

.prompt{font-size:13px;font-weight:900;letter-spacing:.055em;color:var(--orange);margin:0 0 5px;text-transform:uppercase}
.promptbox{display:block;width:100%;height:47px;border:1px solid var(--line-soft);border-radius:var(--radius);background:rgba(255,249,233,.10);color:var(--ink);resize:vertical;min-height:42px;padding:8px 9px;margin-bottom:10px;outline:none;font-size:12px;line-height:1.35}
.promptbox:focus{border-color:var(--orange);background:rgba(255,249,233,.28)}

.habits-title{margin-top:17px!important}
.habit-head,.habit{display:grid;grid-template-columns:minmax(70px,1fr) repeat(7,22px);gap:5px;align-items:center}
.habit-head{margin-bottom:4px}
.habithead{font-size:12px;font-weight:900;text-align:center;color:var(--orange)}
.habit{margin:6px 0}
.habit input[type=text]{padding:5px 2px;font-size:11px}
.habit-streak{font-size:9px;color:var(--muted);text-align:right;grid-column:1/-1;margin-top:-4px}

.menu{border:1px solid var(--line);overflow:hidden}
.menuhead{background:var(--orange);color:#fff;text-align:center;font-size:21px;letter-spacing:.07em;font-weight:900;padding:9px}
.menu-actions{display:flex;gap:6px;padding:7px;border-bottom:1px solid var(--line);background:rgba(255,249,233,.22)}
.menu-actions .btn{flex:1}
.menu-grid{display:grid;grid-template-columns:32px 1fr 1fr 1fr}
.menu-grid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.menu-grid>div:nth-child(4n){border-right:0}
.menu-grid .mh{font-size:10px;font-weight:900;color:var(--orange);text-align:center;padding:8px 2px;letter-spacing:.025em}
.menu-grid .mealhead{text-align:center}
.menu-cell{min-width:0;min-height:52px}
.menu-cell input{height:100%;min-height:52px;padding:8px 6px;font-size:10.5px;border-bottom:0}
.menu-cell:focus-within{background:rgba(255,249,233,.24)}
.menu-day{font-size:17px;font-weight:900;color:var(--orange);display:flex;align-items:center;justify-content:center}

.payments{display:grid;gap:6px}
.payrow{display:grid;grid-template-columns:1.2fr .65fr .8fr 25px;gap:6px;align-items:center}
.payrow input{padding:6px 3px;font-size:10px;min-height:30px}
.payrow input[type=date]{font-size:9px}
.payrow .paid{width:20px;height:20px}
.payment-summary{font-size:11px;font-weight:800;margin-top:8px;color:var(--orange-dark)}

@media(max-width:1050px){
  .lower{grid-template-columns:1fr 1fr}
  .paper{padding:22px}
  .day textarea{height:128px}
}
@media(max-width:700px){
  .app{padding:7px}
  .toolbar{gap:7px}
  .nav{width:100%;display:grid;grid-template-columns:auto 1fr auto}
  .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .btn{min-height:42px;padding:8px 10px}
  .weeklabel{min-width:0;font-size:16px}
  .paper{padding:15px 11px 22px}
  h1{font-size:4.8rem;margin-bottom:14px}
  .days{overflow-x:auto;grid-template-columns:repeat(7,122px);-webkit-overflow-scrolling:touch}
  .day textarea{height:125px;font-size:13px}
  .lower{grid-template-columns:1fr;gap:22px}
  .checkrow{grid-template-columns:20px minmax(0,1fr) 82px}
  .menu-grid{grid-template-columns:28px 1fr 1fr 1fr}
  .menu-cell{min-height:58px}
  .menu-cell input{min-height:58px;font-size:10.5px;padding:7px 5px}
  .progress-wrap{gap:8px}
  .progress-label{font-size:13px}
  .progress-count{min-width:65px;font-size:10px}
}
@media(orientation:landscape) and (max-width:950px){
  .paper{padding:18px}
  .lower{grid-template-columns:1fr 1fr}
  .day textarea{height:115px}
  .app{max-width:none}
}
@media print{
  html,body{background:#fff}
  .toolbar{display:none}
  .app{max-width:none;padding:0}
  .paper{border:0;box-shadow:none;padding:12px}
  .days{grid-template-columns:repeat(7,1fr)}
  .day textarea{height:115px}
  .lower{grid-template-columns:1fr 1fr;gap:14px}
  .menu-actions{display:none}
}

/* HORARIO 2.5 — edición sencilla con formulario emergente */
.schedule-panel{border:1px solid var(--line);background:rgba(255,249,233,.08)}
.schedule-cards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.schedule-day{min-width:0;border-right:1px solid var(--line)}
.schedule-day:last-child{border-right:0}
.schedule-dayname{padding:8px 4px;text-align:center;font-family:var(--font-display);font-size:14px;font-weight:900;letter-spacing:.06em;color:var(--orange);border-bottom:1px solid var(--line)}
.schedule-list{padding:7px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.class-card{appearance:none;width:100%;text-align:left;border:1px solid var(--line-soft);background:rgba(255,249,233,.32);padding:8px;border-radius:4px;color:var(--ink);cursor:pointer}
.class-card:hover,.class-card:focus-visible{border-color:var(--orange);background:rgba(255,249,233,.55);outline:none}
.class-name{font-size:12px;font-weight:800;line-height:1.2}
.class-time{font-size:10px;color:var(--orange-dark);margin-top:3px;font-weight:700}
.add-class{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:8px 5px;border-radius:4px;font-family:var(--font-display);font-size:10px;font-weight:800;cursor:pointer}
.add-class:hover{border-color:var(--orange);color:var(--orange)}
.schedule-empty{font-size:11px;color:var(--muted);padding:6px 3px;line-height:1.35}
.schedule-help{font-size:10px;color:var(--muted);margin-top:7px;text-align:right}
.schedule-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(40,25,18,.34);backdrop-filter:blur(2px)}
.schedule-modal.open{display:flex}
.schedule-dialog{width:min(430px,100%);background:var(--cream);border:1px solid var(--orange);box-shadow:0 12px 35px rgba(60,30,20,.22);padding:18px;border-radius:3px}
.schedule-dialog h3{margin:0 0 3px;font-family:var(--font-display);font-size:22px;color:var(--orange);text-transform:uppercase;letter-spacing:.04em}
.schedule-dialog .modal-day{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:14px;text-transform:uppercase}
.schedule-field{display:block;margin:10px 0}
.schedule-field span{display:block;font-family:var(--font-display);font-size:11px;font-weight:900;color:var(--orange-dark);text-transform:uppercase;margin-bottom:4px}
.schedule-field input{width:100%;height:44px;border:1px solid var(--line-soft);background:rgba(255,249,233,.35);color:var(--ink);padding:9px 10px;font-size:14px;border-radius:3px;outline:none}
.schedule-field input:focus{border-color:var(--orange);background:rgba(255,249,233,.6)}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.modal-actions .btn{width:100%}
.modal-actions .delete-btn{grid-column:1/-1;border-color:var(--line);color:var(--orange-dark);background:transparent}
@media(max-width:900px){.schedule-cards{grid-template-columns:repeat(7,122px);overflow-x:auto;-webkit-overflow-scrolling:touch}.schedule-day{min-height:150px}.schedule-help{text-align:left}}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="nav"><button class="btn" id="prev">‹ Anterior</button><span class="weeklabel" id="weekLabel"></span><button class="btn" id="next">Siguiente ›</button></div>
    <div class="actions"><button class="btn primary" id="today">Hoy</button><button class="btn" id="print">Imprimir</button></div>
  </div>
  <div class="paper">
    <h1>JOURNAL</h1>
    <div class="schedule-head">
      <div class="schedule-title">Horario fijo · se repite cada semana</div>
      <div class="schedule-actions"><button class="btn schedule-btn" id="editSchedule">Añadir clase</button></div>
    </div>
    <div class="schedule-panel" id="schedulePanel"></div>
    <div class="progress-wrap"><span class="progress-label">Progreso semanal</span><div class="progress"><span id="progressBar"></span></div><span class="progress-count" id="progressCount">0 de 0</span></div>
    <div class="lower">
      <section class="section">
        <h2>TAREAS Y PENDIENTES</h2><div class="checks" id="tasks"></div>
        <h2 class="habits-title">SEGUIMIENTO DE HÁBITOS</h2>
        <div class="habit-head"><span></span><span class="habithead">L</span><span class="habithead">M</span><span class="habithead">X</span><span class="habithead">J</span><span class="habithead">V</span><span class="habithead">S</span><span class="habithead">D</span></div>
        <div id="habits"></div>
      </section>
      <section class="section">
        <div class="prompt">Frase de la semana</div><textarea class="promptbox" data-key="phrase"></textarea>
        <div class="prompt">Agradecido por</div><textarea class="promptbox" data-key="grateful"></textarea>
        <div class="prompt">Planes / salida</div><textarea class="promptbox" data-key="plans"></textarea>
        <div class="prompt">Notas</div><textarea class="promptbox" data-key="notes"></textarea>
        <div class="prompt">Pagos</div>
        <div class="payments" id="payments"></div><div class="payment-summary" id="paymentSummary"></div>
      </section>
      <section class="section">
        <h2>COMPRAS</h2><div class="checks" id="groceries"></div>
      </section>
      <section class="section">
        <div class="menu">
          <div class="menuhead">MENÚ</div>
          <div class="menu-actions"><button class="btn small" id="copyMenu">Copiar anterior</button><button class="btn small" id="clearMenu">Limpiar</button></div>
          <div class="menu-grid" id="menu"></div>
        </div>
      </section>
    </div>
  </div>
</div>
<div class="schedule-modal" id="scheduleModal" aria-hidden="true">
  <div class="schedule-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Clase</h3>
    <div class="modal-day"><select id="modalDaySelect" class="mini-select"></select><input type="hidden" id="modalDay"></div>
    <label class="schedule-field"><span>Materia</span><input id="classNameInput" type="text" placeholder="Inglés General III" autocomplete="off"></label>
    <label class="schedule-field"><span>Horario</span><input id="classTimeInput" type="text" placeholder="1 - 2:30 p. m." autocomplete="off"></label>
    <div class="modal-actions">
      <button class="btn primary" id="saveClass" type="button">Guardar</button>
      <button class="btn" id="cancelClass" type="button">Cancelar</button>
      <button class="btn delete-btn" id="deleteClass" type="button">Eliminar clase</button>
    </div>
  </div>
</div>
<script>
const KEY="mi-semana-v2"; const OLD_KEY="mi-semana-v1"; const SCHEDULE_KEY="journal-fixed-schedule-v1"; let weekOffset=0; let scheduleEditing=false;
const dayNames=["LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO","DOMINGO"], menuDays=["L","M","X","J","V","S","D"];
const taskCats=["Universidad","Casa","Personal","Cocina","Otro"], groceryCats=["Frutas","Verduras","Lácteos","Proteína","Despensa","Limpieza","Otro"];
function monday(d){d=new Date(d);let n=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d}
function key(){let d=monday(new Date());d.setDate(d.getDate()+weekOffset*7);return d.toISOString().slice(0,10)}
function load(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch{return{}}}
let all=load(KEY); const old=load(OLD_KEY);
function blank(){return {days:Array(7).fill(""),tasks:Array.from({length:10},()=>({t:"",c:false,cat:"Universidad",p:"Media"})),groceries:Array.from({length:10},()=>({t:"",c:false,cat:"Despensa"})),habits:Array.from({length:5},()=>({t:"",c:Array(7).fill(false)})),menu:Array.from({length:7},()=>({b:"",l:"",d:""})),phrase:"",grateful:"",plans:"",notes:"",payments:Array.from({length:5},()=>({t:"",a:"",d:"",c:false}))}}
function migrate(k){if(all[k])return; if(old[k]){let o=old[k],n=blank();n.days=o.days||n.days;n.tasks=(o.tasks||n.tasks).map(x=>({...x,cat:x.cat||"Universidad",p:x.p||"Media"}));n.groceries=(o.groceries||n.groceries).map(x=>({...x,cat:x.cat||"Despensa"}));n.habits=o.habits||n.habits;n.phrase=o.phrase||"";n.grateful=o.grateful||"";n.plans=o.plans||"";n.notes=o.notes||"";let ms=o.menu||[];n.menu=n.menu.map((x,i)=>{let v=ms[i];return typeof v==='object'?v:{b:v||"",l:"",d:""}});n.payments=blank().payments;all[k]=n}else all[k]=blank()}
function data(){let k=key();migrate(k);return all[k]}
function save(){localStorage.setItem(KEY,JSON.stringify(all))}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function getSchedule(){
  let raw=load(SCHEDULE_KEY);
  if(raw && Array.isArray(raw.days) && raw.days.length===7) return raw.days.map(day=>Array.isArray(day)?day.map(c=>({n:c.n||"",t:c.t||""})):[]);
  if(Array.isArray(raw) && raw.length===7){
    let converted=raw.map(v=>{
      if(Array.isArray(v)) return v.map(c=>({n:c.n||"",t:c.t||""}));
      let text=String(v||"").trim(); if(!text)return [];
      return text.split(/\n+/).map(line=>{let parts=line.split(/\s*[·|—–]\s*/);return {n:(parts[0]||"").trim(),t:(parts.slice(1).join(" · ")||"").trim()}}).filter(c=>c.n||c.t);
    });
    saveSchedule(converted); return converted;
  }
  let d=data();
  let initial=(d.days||Array(7).fill("")).map(v=>{
    let text=String(v||"").trim(); if(!text)return [];
    return text.split(/\n+/).map(line=>{let parts=line.split(/\s*[·|—–]\s*/);return {n:(parts[0]||"").trim(),t:(parts.slice(1).join(" · ")||"").trim()}}).filter(c=>c.n||c.t);
  });
  if(initial.some(x=>x.length)){saveSchedule(initial);return initial}
  return Array.from({length:7},()=>[]);
}
function saveSchedule(arr){localStorage.setItem(SCHEDULE_KEY,JSON.stringify({days:arr}))}
function openClassModal(dayIndex,classIndex=-1){
  const sch=getSchedule();
  const c=classIndex>=0?(sch[dayIndex][classIndex]||{n:"",t:""}):{n:"",t:""};
  document.getElementById("scheduleModal").classList.add("open");
  document.getElementById("modalTitle").textContent=classIndex>=0?"Editar clase":"Añadir clase";
  document.getElementById("modalDaySelect").innerHTML=dayNames.map((d,i)=>`<option value="${i}">${d}</option>`).join(""); document.getElementById("modalDaySelect").value=String(dayIndex);
  document.getElementById("classNameInput").value=c.n||"";
  document.getElementById("classTimeInput").value=c.t||"";
  document.getElementById("modalDay").value=String(dayIndex);
  document.getElementById("modalDay").dataset.index=classIndex;
  document.getElementById("deleteClass").style.display=classIndex>=0?'block':'none'; document.getElementById("modalDaySelect").disabled=classIndex>=0;
  setTimeout(()=>document.getElementById("classNameInput").focus(),50);
}
function closeClassModal(){document.getElementById("scheduleModal").classList.remove("open")}
document.getElementById("modalDaySelect").onchange=()=>{document.getElementById("modalDay").value=document.getElementById("modalDaySelect").value};
function saveClassFromModal(){
  const day=+document.getElementById("modalDay").value;
  const index=+document.getElementById("modalDay").dataset.index;
  const n=document.getElementById("classNameInput").value.trim();
  const t=document.getElementById("classTimeInput").value.trim();
  if(!n && !t){closeClassModal();return}
  let sch=getSchedule();
  if(index>=0) sch[day][index]={n,t}; else sch[day].push({n,t});
  saveSchedule(sch);closeClassModal();renderSchedule();
}
function deleteClassFromModal(){
  const day=+document.getElementById("modalDay").value;
  const index=+document.getElementById("modalDay").dataset.index;
  if(index<0)return;
  let sch=getSchedule();sch[day].splice(index,1);saveSchedule(sch);closeClassModal();renderSchedule();
}
function renderSchedule(){
  let sch=getSchedule();
  const cards=sch.map((day,i)=>`<div class="schedule-day"><div class="schedule-dayname">${dayNames[i]}</div><div class="schedule-list">${day.length?day.map((c,j)=>`<button class="class-card" data-edit-class="${i}-${j}" type="button"><div class="class-name">${esc(c.n)}</div><div class="class-time">${esc(c.t)}</div></button>`).join(""):'<div class="schedule-empty">Sin clases</div>'}<button class="add-class" data-add-class="${i}" type="button">+ Añadir clase</button></div></div>`).join("");
  document.getElementById("schedulePanel").innerHTML=`<div class="schedule-cards">${cards}</div><div class="schedule-help">Toca una clase para editarla · usa «Añadir clase» para agregar otra</div>`;
  document.getElementById("editSchedule").textContent='Añadir clase';
  document.querySelectorAll('[data-add-class]').forEach(btn=>btn.onclick=()=>openClassModal(+btn.dataset.addClass));
  document.querySelectorAll('[data-edit-class]').forEach(btn=>btn.onclick=()=>{let [i,j]=btn.dataset.editClass.split('-').map(Number);openClassModal(i,j)});
}
function render(){let d=data(),md=monday(new Date(key()+"T00:00:00"));document.getElementById("weekLabel").textContent=md.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+" – "+new Date(md.getTime()+6*86400000).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
 renderSchedule();
 renderTasks(d.tasks);renderGroceries(d.groceries);renderHabits(d.habits);renderMenu(d.menu);renderPayments(d.payments);document.querySelectorAll("[data-key]").forEach(x=>x.value=d[x.dataset.key]||"");updateProgress();wire()}
function selectHTML(opts,val,cls='mini-select'){return `<select class="${cls}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join("")}</select>`}
function renderTasks(arr){
  const groups=["Alta","Media","Baja"];
  document.getElementById("tasks").innerHTML=groups.map(g=>{
    const items=arr.map((x,i)=>({x,i})).filter(v=>(v.x.p||"Media")===g && v.x.t.trim());
    if(!items.length)return "";
    return `<div class="group-block"><div class="group-title priority-${g.toLowerCase()}">${g}<span class="group-count">${items.length}</span></div>${items.map(({x,i})=>`<label class="checkrow grouped-row"><input type="checkbox" data-tc="${i}" ${x.c?'checked':''}><input type="text" data-tt="${i}" value="${esc(x.t)}" placeholder="Pendiente"><select class="mini-select priority-${String(x.p||'Media').toLowerCase()}" data-tp="${i}"><option ${x.p==='Alta'?'selected':''}>Alta</option><option ${(!x.p||x.p==='Media')?'selected':''}>Media</option><option ${x.p==='Baja'?'selected':''}>Baja</option></select></label>`).join("")}</div>`;
  }).join("")+`<div class="group-block"><div class="group-title priority-media">Nuevas tareas</div>${arr.map((x,i)=>({x,i})).filter(v=>!v.x.t.trim()).map(({x,i})=>`<label class="checkrow grouped-row"><input type="checkbox" data-tc="${i}" ${x.c?'checked':''}><input type="text" data-tt="${i}" value="" placeholder="Pendiente"><select class="mini-select priority-${String(x.p||'Media').toLowerCase()}" data-tp="${i}"><option ${x.p==='Alta'?'selected':''}>Alta</option><option ${(!x.p||x.p==='Media')?'selected':''}>Media</option><option ${x.p==='Baja'?'selected':''}>Baja</option></select></label>`).join("")}</div>`;
}
function renderGroceries(arr){
  const groups=groceryCats;
  document.getElementById("groceries").innerHTML=groups.map(g=>{
    const items=arr.map((x,i)=>({x,i})).filter(v=>(v.x.cat||"Despensa")===g && v.x.t.trim());
    if(!items.length)return "";
    return `<div class="group-block"><div class="group-title">${g}<span class="group-count">${items.length}</span></div>${items.map(({x,i})=>`<label class="checkrow grocery grouped-row"><input type="checkbox" data-gc="${i}" ${x.c?'checked':''}><input type="text" data-gt="${i}" value="${esc(x.t)}" placeholder="Producto"><select class="mini-select" data-gcat="${i}">${groceryCats.map(o=>`<option ${o===(x.cat||'Despensa')?'selected':''}>${o}</option>`).join("")}</select></label>`).join("")}</div>`;
  }).join("")+`<div class="group-block"><div class="group-title">Nuevos productos</div>${arr.map((x,i)=>({x,i})).filter(v=>!v.x.t.trim()).map(({x,i})=>`<label class="checkrow grocery grouped-row"><input type="checkbox" data-gc="${i}" ${x.c?'checked':''}><input type="text" data-gt="${i}" value="" placeholder="Producto"><select class="mini-select" data-gcat="${i}">${groceryCats.map(o=>`<option ${o===(x.cat||'Despensa')?'selected':''}>${o}</option>`).join("")}</select></label>`).join("")}</div>`;
}
function renderHabits(arr){document.getElementById("habits").innerHTML=arr.map((h,r)=>{let done=h.c.filter(Boolean).length;return `<div class="habit"><input type="text" data-habit="${r}" value="${esc(h.t)}" placeholder="Hábito">${h.c.map((v,i)=>`<input type="checkbox" data-hc="${r}-${i}" ${v?'checked':''}>`).join("")}<div class="habit-streak">${done} / 7 días</div></div>`}).join("")}
function renderMenu(arr){document.getElementById("menu").innerHTML=`<div class="mh"></div><div class="mh mealhead">DESAYUNO</div><div class="mh mealhead">COMIDA</div><div class="mh mealhead">CENA</div>`+arr.map((m,i)=>`<div class="menu-day">${menuDays[i]}</div><div class="menu-cell"><input data-m="${i}-b" value="${esc(m.b)}" placeholder="Escribe aquí…"></div><div class="menu-cell"><input data-m="${i}-l" value="${esc(m.l)}" placeholder="Escribe aquí…"></div><div class="menu-cell"><input data-m="${i}-d" value="${esc(m.d)}" placeholder="Escribe aquí…"></div>`).join("")}
function renderPayments(arr){document.getElementById("payments").innerHTML=arr.map((p,i)=>`<div class="payrow"><input data-pt="${i}" value="${esc(p.t)}" placeholder="Concepto"><input data-pa="${i}" value="${esc(p.a)}" placeholder="$0" inputmode="decimal"><input type="date" data-pd="${i}" value="${esc(p.d)}"><input class="paid" type="checkbox" data-pc="${i}" ${p.c?'checked':''} title="Pagado"></div>`).join("");let total=arr.reduce((s,p)=>s+(parseFloat(String(p.a).replace(/[^0-9.]/g,''))||0),0),pending=arr.filter(p=>p.a&&!p.c).reduce((s,p)=>s+(parseFloat(String(p.a).replace(/[^0-9.]/g,''))||0),0);document.getElementById("paymentSummary").textContent=total?`Total: $${total.toFixed(2)} · Pendiente: $${pending.toFixed(2)}`:""}
function updateProgress(){let d=data(),filled=d.tasks.filter(x=>x.t.trim()).length,done=d.tasks.filter(x=>x.t.trim()&&x.c).length,pct=filled?Math.round(done/filled*100):0;document.getElementById("progressBar").style.width=pct+"%";document.getElementById("progressCount").textContent=filled?`${done} de ${filled} · ${pct}%`:"Sin tareas"}
function wire(){document.querySelectorAll("[data-sday]").forEach(x=>x.oninput=()=>{let sch=getSchedule();sch[+x.dataset.sday]=x.value;saveSchedule(sch)});document.querySelectorAll("[data-key]").forEach(x=>x.oninput=()=>{data()[x.dataset.key]=x.value;save()});
 document.querySelectorAll("[data-tt]").forEach(x=>x.oninput=()=>{data().tasks[x.dataset.tt].t=x.value;save();updateProgress()});document.querySelectorAll("[data-tc]").forEach(x=>x.onchange=()=>{data().tasks[x.dataset.tc].c=x.checked;save();updateProgress()});document.querySelectorAll("[data-tp]").forEach(x=>x.onchange=()=>{data().tasks[x.dataset.tp].p=x.value;save();renderTasks(data().tasks);wire()});
 document.querySelectorAll("[data-gt]").forEach(x=>x.oninput=()=>{data().groceries[x.dataset.gt].t=x.value;save()});document.querySelectorAll("[data-gc]").forEach(x=>x.onchange=()=>{data().groceries[x.dataset.gc].c=x.checked;save()});document.querySelectorAll("[data-gcat]").forEach(x=>x.onchange=()=>{data().groceries[x.dataset.gcat].cat=x.value;save();renderGroceries(data().groceries);wire()});
 document.querySelectorAll("[data-habit]").forEach(x=>x.oninput=()=>{data().habits[x.dataset.habit].t=x.value;save()});document.querySelectorAll("[data-hc]").forEach(x=>x.onchange=()=>{let[a,b]=x.dataset.hc.split('-').map(Number);data().habits[a].c[b]=x.checked;save();renderHabits(data().habits);wire()});
 document.querySelectorAll("[data-m]").forEach(x=>x.oninput=()=>{let[a,b]=x.dataset.m.split('-');data().menu[+a][b]=x.value;save()});
 document.querySelectorAll("[data-pt]").forEach(x=>x.oninput=()=>{data().payments[x.dataset.pt].t=x.value;save()});document.querySelectorAll("[data-pa]").forEach(x=>x.oninput=()=>{data().payments[x.dataset.pa].a=x.value;save();renderPayments(data().payments);wire()});document.querySelectorAll("[data-pd]").forEach(x=>x.onchange=()=>{data().payments[x.dataset.pd].d=x.value;save()});document.querySelectorAll("[data-pc]").forEach(x=>x.onchange=()=>{data().payments[x.dataset.pc].c=x.checked;save();renderPayments(data().payments);wire()})}

document.getElementById("editSchedule").onclick=()=>openClassModal(0);
document.getElementById("prev").onclick=()=>{weekOffset--;render()};document.getElementById("next").onclick=()=>{weekOffset++;render()};document.getElementById("today").onclick=()=>{weekOffset=0;render()};document.getElementById("print").onclick=()=>window.print();
document.getElementById("copyMenu").onclick=()=>{if(weekOffset===-999)return;let prevOffset=weekOffset-1;let dkey=key();let pm=monday(new Date());pm.setDate(pm.getDate()+prevOffset*7);let pk=pm.toISOString().slice(0,10);migrate(pk);data().menu=JSON.parse(JSON.stringify(all[pk].menu));save();render()};
document.getElementById("clearMenu").onclick=()=>{data().menu=blank().menu;save();render()};
document.getElementById("saveClass").onclick=saveClassFromModal;
document.getElementById("cancelClass").onclick=closeClassModal;
document.getElementById("deleteClass").onclick=deleteClassFromModal;
document.getElementById("scheduleModal").addEventListener("click",e=>{if(e.target.id==="scheduleModal")closeClassModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeClassModal();if(e.key==="Enter"&&document.getElementById("scheduleModal").classList.contains("open")){if(document.activeElement.tagName!=="TEXTAREA")saveClassFromModal()}});
render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
